name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CONFIGURE_FLAGS: >-
    --target-list=mipsel-softmmu
    --disable-werror
    --disable-docs
    --disable-tools
    --disable-guest-agent
    --disable-spice
    --disable-virglrenderer
    --disable-opengl
    --disable-curl
    --disable-libssh
    --disable-gnutls
    --disable-gcrypt
    --disable-zstd
    --disable-seccomp
    --disable-libusb
    --disable-usb-redir
    --disable-smartcard
    --disable-vte
    --disable-curses
    --disable-dbus-display
    --disable-plugins

jobs:
  linux:
    name: Build (Linux x86_64, portable)
    # Build inside the oldest distribution we support: the bundle still uses
    # the build host's glibc and ELF interpreter.
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      # checkout runs before the dependency step, but the bare image has no git.
      - name: Install git for checkout
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ninja-build python3 python3-venv python3-pip python3-tomli pkg-config patchelf \
            libglib2.0-dev libglib2.0-bin libpixman-1-dev zlib1g-dev \
            libgtk-3-dev libgdk-pixbuf-2.0-dev libpng-dev libjpeg-dev \
            libasound2-dev libpulse-dev libxkbcommon-dev \
            shared-mime-info hicolor-icon-theme adwaita-icon-theme
      - name: Configure
        run: |
          ./configure $CONFIGURE_FLAGS \
            --disable-cap-ng --disable-bpf --disable-rdma --disable-xen \
            --disable-numa --disable-linux-io-uring --disable-fuse --disable-libudev
      - name: Build
        run: ninja -C build qemu-system-mipsel
      - name: Package portable bundle
        run: ./tools/package-linux.sh build/qemu-system-mipsel dist-book2
      - name: Archive
        run: tar -czf book2-qemu-linux-x86_64.tar.gz dist-book2
      - uses: actions/upload-artifact@v4
        with:
          name: book2-qemu-linux-x86_64
          path: book2-qemu-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    name: Build (macOS arm64, portable)
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          brew install ninja pkg-config pixman python@3.12 \
            glib gtk+3 shared-mime-info adwaita-icon-theme
      - name: Configure
        run: |
          export PATH="$(brew --prefix python@3.12)/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig"
          ./configure $CONFIGURE_FLAGS
      - name: Build
        run: ninja -C build qemu-system-mipsel
      - name: Package portable bundle
        run: ./tools/package-macos.sh build/qemu-system-mipsel dist-book2
      - name: Archive
        run: tar -czf book2-qemu-macos-arm64.tar.gz dist-book2
      - uses: actions/upload-artifact@v4
        with:
          name: book2-qemu-macos-arm64
          path: book2-qemu-macos-arm64.tar.gz
          if-no-files-found: error

  windows:
    name: Build (Windows x86_64, UCRT64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-sdl2
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-shared-mime-info
            mingw-w64-ucrt-x86_64-binutils
            diffutils
            git
      - name: Configure and build
        shell: msys2 {0}
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          export PATH=/ucrt64/bin:/usr/bin:$PATH
          ./configure $CONFIGURE_FLAGS
          ninja -C build qemu-system-mipsel.exe
      - name: Package portable bundle
        shell: msys2 {0}
        run: |
          set -e
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          export PATH=/ucrt64/bin:/usr/bin:$PATH
          python tools/package.py \
            --qemu-source "$(cygpath -m "$GITHUB_WORKSPACE")" \
            --exe build/qemu-system-mipsel.exe \
            --msys-root "$(cygpath -m /)" \
            --output "$(cygpath -m "$RUNNER_TEMP")/dist-book2"
          # GTK needs a compiled schema cache; make sure it exists even if the
          # MSYS2 package only shipped the XML sources.
          glib-compile-schemas "$(cygpath -u "$RUNNER_TEMP")/dist-book2/share/glib-2.0/schemas"
          cp "$(cygpath -u "$GITHUB_WORKSPACE")/README.md" "$(cygpath -u "$RUNNER_TEMP")/dist-book2/README.md"
      - name: Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ runner.temp }}/dist-book2" `
            -DestinationPath "${{ runner.temp }}/book2-qemu-windows-x86_64.zip" `
            -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: book2-qemu-windows-x86_64
          path: ${{ runner.temp }}/book2-qemu-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
